<div class="pageTable active">
    <div class="add-search">
        <div class="search">
            <img src="../images/search.png" id="searchIcon" />
            <input
                type="text"
                id="search"
                placeholder="Pesquise por nome ou código."
            />
            <button class="filter"><img src="../images/filter.png" /></button>
        </div>
        <button class="add-button"><span>+</span> Adicionar Área</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>IMAGEM</th>
                <th>EQUIPAMENTO</th>
                <th>CÓDIGO</th>
                <th>ALTO VALOR</th>
                <th>ÁREA</th>
                <th>DISPONÍVEL</th>
                <th>AÇÕES</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <div class="pagination">
    </div>
</div>

<div class="pageEditAdd">
    <form class="formEditAdd">
        <h2>ADICIONAR EQUIPAMENTO</h2>

        <div class="form-group">
            <label for="nomeEquipamento">Nome do Equipamento</label>
            <input type="text" id="nomeEquipamento" required />
        </div>

        <div class="form-group">
            <label for="codId">Código de Identificação</label>
            <input type="text" id="codId" required />
        </div>

        <div class="form-group">
            <label for="area">Área</label>
            <input type="text" id="area" placeholder="Digite o nome da área" />
        </div>

        <div class="form-group">
            <label for="imagem">Imagem</label>
            <label for="imagem" id="imgInput">
                <img src="../images/image-upload.png" />
                Arraste a imagem ou clique aqui para procurar nos seus arquivos.
            </label>
            <input type="file" id="imagem" required/>
        </div>

        <div class="form-group checkboxGroup">
            <label for="altoValor">
                <input type="checkbox" id="altoValor" />
                Definir como item de alto valor?
            </label>
        </div>

        <div class="buttonGroup">
            <button class="return" type="button">Voltar</button>
            <button class="submit" type="submit">Criar</button>
        </div>
    </form>
</div>

<div class="overlayFilter">
    <div class="filterBox">
        <h2>FILTRAR BUSCA</h2>

        <div class="filterOpt checkboxGroup">
            <label for="checkValor">
                <input type="checkbox" id="checkValor" />
                Mostrar apenas itens marcados como alto valor.
            </label>
        </div>

        <div class="filterOpt">
            <label for="selectDisponibilidade"
                >Mostrar apenas itens com disponibilidade marcada como:</label
            >
            <select id="selectDisponibilidade">
                <option value="ambas" default>Ambas</option>
                <option value="indisponivel">Indisponível</option>
                <option value="disponivel">Disponível</option>
            </select>
        </div>

        <div class="filterOpt">
            <label for="inputArea">Mostrar apenas itens da área:</label>
            <input
                type="text"
                placeholder="Digite o nome da área ou deixe vazio para qualquer."
                id="inputArea"
            />
        </div>

        <div class="buttonGroup">
            <button class="closeFilter">Voltar</button>
            <button class="applyFilter">Aplicar</button>
        </div>
    </div>
</div>

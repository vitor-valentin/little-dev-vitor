<div class="pageTable active">
    <div class="add-search">
        <div class="search">
            <img src="../images/search.png" id="searchIcon" />
            <input
                type="text"
                id="search"
                placeholder="Pesquise por equipamento, seu código, membro que recebeu ou local."
            />
            <button class="filter"><img src="../images/filter.png" /></button>
        </div>
        <button class="add-button"><span>+</span> Registrar Empréstimo</button>
    </div>

    <table>
        <thead>
            <tr class="smaller">
                <th>EQUIPAMENTO</th>
                <th>CÓDIGO EQ.</th>
                <th>ALTO VALOR</th>
                <th>DATA REC.</th>
                <th>DATA DEVOLUÇÃO</th>
                <th>DATA DEVOLVIDO</th>
                <th>RECEBIDO POR</th>
                <th>SALA/LOCAL</th>
                <th>AÇÕES</th>
            </tr>
        </thead>
        <tbody class="small">
        </tbody>
    </table>

    <div class="pagination">
    </div>
</div>

<div class="pageEditAdd">
    <form class="formEditAdd">
        <h2>REGISTRAR EMPRÉSTIMO</h2>

        <div class="form-group">
            <label for="nomeEquipamento">Nome do Equipamento</label>
            <input type="text" id="nomeEquipamento" name="nomeEquipamento" placeholder="Procure um equipamento por nome ou código." required />
        </div>

        <div style="display:flex; gap: 12px; flex-wrap: wrap; width: 90%;">
            <div class="form-group" style="flex: 1 1 45%;">
                <label for="dataRecebimento">Data Recebimento</label>
                <input type="datetime-local" id="dataRecebimento" name="dataRecebimento" required />
            </div>

            <div class="form-group" style="flex: 1 1 45%;">
                <label for="dataDevolucao">Data Devolução</label>
                <input type="datetime-local" id="dataDevolucao" name="dataDevolucao" required />
            </div>

            <div class="form-group" style="flex: 1 1 15%; min-width: 100px;">
                <label for="salaLocal">Sala/Local</label>
                <input type="text" id="salaLocal" name="salaLocal" />
            </div>
        </div>

        <div class="form-group">
            <label for="membro">Membro</label>
            <input type="text" id="membro" name="membro" placeholder="Procure um membro por nome, e-mail ou telefone." required />
        </div>

        <div class="form-group">
            <label for="obsText">Observações</label>
            <textarea id="obsText" style="height: 200px;"></textarea>
        </div>

        <div class="buttonGroup">
            <button class="return" type="button">Voltar</button>
            <button class="submit" type="submit">Registrar</button>
        </div>
    </form>
</div>

<div class="overlayFilter">
    <div class="filterBox">
        <h2>FILTRAR BUSCA</h2>

        <div class="filterOpt checkboxGroup">
            <label for="checkValor">
                <input type="checkbox" id="checkValor" />
                Mostrar apenas empréstimos de items com alto valor.
            </label>
        </div>

        <div class="filterOpt checkboxGroup">
            <label for="checkAtraso">
                <input type="checkbox" id="checkAtraso" />
                Mostrar apenas empréstimos atrasados devolvidos ou não.
            </label>
        </div>

        <div class="filterOpt">
            <label for="selectStatus"
                >Mostrar apenas empréstimos marcados como:</label
            >
            <select id="selectStatus">
                <option value="todos" default>Todos</option>
                <option value="finalizados">Finalizados</option>
                <option value="agendados">Agendados</option>
                <option value="em-uso">Em Uso</option>
            </select>
        </div>

        <div class="filterOpt">
            <label for="inputArea">Mostrar apenas empréstimos com itens da área:</label>
            <input
                type="text"
                placeholder="Digite o nome da área ou deixe vazio para qualquer."
                id="inputArea"
            />
        </div>

        <div class="filterOpt">
            <label>Mostrar apenas empréstimos entre as datas:</label>
            <div class="dateFilterGroup">
                <div class="dateInputBox">
                    <label for="dataInicio">Início</label>
                    <div class="customDateInput">
                        <span class="calendarIcon"></span>
                        <input type="text" id="dataInicio" placeholder="DD/MM/AAAA" />
                    </div>
                </div>
            
                <div class="dateInputBox">
                    <label for="dataFim">Fim</label>
                    <div class="customDateInput">
                        <span class="calendarIcon"></span>
                        <input type="text" id="dataFim" placeholder="DD/MM/AAAA" />
                    </div>
                </div>
            </div>
        </div>

        <div class="buttonGroup">
            <button class="closeFilter">Voltar</button>
            <button class="applyFilter">Aplicar</button>
        </div>
    </div>
</div>
